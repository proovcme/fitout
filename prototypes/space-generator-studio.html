<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FITOUT · Генератор пространств</title><style>
:root{--ink:#1d2930;--paper:#eee5d4;--acid:#e7ca4c;--blue:#688f96}*{box-sizing:border-box}body{margin:0;background:#789291;color:var(--ink);font:700 14px system-ui}.app{width:min(1260px,calc(100% - 24px));margin:20px auto;background:var(--paper);border:3px solid var(--ink);box-shadow:12px 14px 0 #26393d88}.head{display:flex;justify-content:space-between;gap:18px;padding:18px 20px;border-bottom:3px solid var(--ink)}h1,h2{margin:0;font-family:Georgia,serif}.head p{max-width:560px;margin:0;color:#526269}.body{display:grid;grid-template-columns:minmax(440px,1.3fr) minmax(320px,.7fr)}.plan{padding:18px;background:#344f54}.plan canvas{display:block;width:100%;aspect-ratio:3/2;background:#e9e1cf;border:2px solid var(--ink)}.panel{padding:18px;display:grid;align-content:start;gap:13px;max-height:calc(100vh - 130px);overflow:auto}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:grid;gap:5px;font-size:10px;letter-spacing:.1em}input,select,button{min-height:42px;border:2px solid var(--ink);background:#fff8e8;padding:8px;font:800 13px system-ui}button{background:var(--acid);box-shadow:3px 3px 0 var(--ink);cursor:pointer}.card{padding:12px;border:2px solid var(--ink);background:#fff8e8}.card.selected{outline:4px solid var(--acid)}.card small{color:#9a4f31}.room-actions{display:flex;gap:7px;margin-top:8px}.tasks{display:grid;gap:6px}.task{padding:8px;background:#d5d0bf;border-left:5px solid var(--blue)}.event{padding:12px;background:#9b4938;color:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}@media(max-width:800px){.body{grid-template-columns:1fr}.panel{max-height:none}.plan{position:sticky;top:0;z-index:2}.head{display:block}.head p{margin-top:8px}}
</style></head><body><main class="app"><header class="head"><div><small>FITOUT · ИНСТРУМЕНТ ДВИЖКА</small><h1>Пространство меняется физически</h1></div><p>Один seed собирает план, помещения, наполнение, текущую стадию, следующий фронт работ и только уместные события.</p></header><section class="body"><div class="plan"><canvas id="plan" width="900" height="600"></canvas></div><aside class="panel"><div class="controls"><label>SEED<input id="seed" value="Банкрот-этаж-01"></label><label>СТАДИЯ<select id="stage"><option value="shell">голый контур</option><option value="demolition">демонтаж</option><option value="rough">черновые</option><option value="engineering">инженерия</option><option value="finish">отделка</option><option value="furnished">мебель</option></select></label></div><button id="generate">Собрать этаж</button><div id="rooms"></div><h2>Следующие работы</h2><div id="tasks" class="tasks"></div><button id="eventButton">Бросить событие</button><div id="event"></div></aside></section></main><script type="module">
import{generateSite,generateSpatialTasks,generateSpatialEvent,advanceRoom,SPACE_STAGES}from'./lib/spatial-generator.js';
const $=id=>document.getElementById(id),canvas=$('plan'),ctx=canvas.getContext('2d'),colors={shell:'#918f84',demolition:'#b5674e',rough:'#c99e61',engineering:'#598c94',finish:'#dad1bd',furnished:'#78a384'};let site,selected='room-1',eventIndex=0;
function build(){site=generateSite($('seed').value,{stage:$('stage').value});selected=site.rooms[0].id;render()}
function renderPlan(){ctx.clearRect(0,0,canvas.width,canvas.height);const pad=38,sx=(canvas.width-pad*2)/site.bounds.width,sz=(canvas.height-pad*2)/site.bounds.depth;for(const room of site.rooms){const x=pad+room.x*sx,y=pad+room.z*sz,w=room.width*sx,h=room.depth*sz;ctx.fillStyle=colors[room.stage];ctx.strokeStyle=room.id===selected?'#e7ca4c':'#1d2930';ctx.lineWidth=room.id===selected?8:4;ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);ctx.fillStyle='#1d2930';ctx.font='900 20px system-ui';ctx.fillText(room.label,x+12,y+29);ctx.font='700 13px system-ui';ctx.fillText(`${room.area} м² · ${room.stage}`,x+12,y+50);for(const element of room.elements){ctx.fillStyle='#24373b';ctx.save();ctx.translate(x+element.x*w,y+element.z*h);ctx.rotate(element.rotation*Math.PI/180);ctx.fillRect(-7,-7,14,14);ctx.restore()}}}
function render(){renderPlan();$('rooms').innerHTML=site.rooms.map(room=>`<article class="card ${room.id===selected?'selected':''}" data-room="${room.id}"><small>${room.stage.toUpperCase()} · ${room.area} М²</small><h2>${room.label}</h2><p>${room.elements.map(item=>item.kind).join(' · ')||'пусто'}</p><div class="room-actions"><button data-advance="${room.id}" ${room.stage==='furnished'?'disabled':''}>Следующая стадия</button></div></article>`).join('');$('tasks').innerHTML=generateSpatialTasks(site).map(task=>`<div class="task"><b>${task.roomLabel}</b><br>${task.workType} → ${task.toStage}</div>`).join('')||'<div class="task">Этаж готов. Пора искать замечания.</div>';$('rooms').querySelectorAll('[data-room]').forEach(card=>card.onclick=event=>{if(event.target.closest('button'))return;selected=card.dataset.room;render()});$('rooms').querySelectorAll('[data-advance]').forEach(button=>button.onclick=()=>{advanceRoom(site,button.dataset.advance);selected=button.dataset.advance;render()})}
$('generate').onclick=build;$('eventButton').onclick=()=>{const incident=generateSpatialEvent(site,`${site.seed}:manual:${eventIndex++}`);$('event').innerHTML=incident?`<article class="event"><b>${incident.roomLabel}</b><p>${incident.text}</p><small>${JSON.stringify(incident.effect)}</small></article>`:'<article class="card">Сегодня пространство решило не сопротивляться.</article>'};canvas.onclick=event=>{const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width*canvas.width,y=(event.clientY-rect.top)/rect.height*canvas.height,pad=38,sx=(canvas.width-pad*2)/site.bounds.width,sz=(canvas.height-pad*2)/site.bounds.depth,room=site.rooms.find(item=>x>=pad+item.x*sx&&x<=pad+(item.x+item.width)*sx&&y>=pad+item.z*sz&&y<=pad+(item.z+item.depth)*sz);if(room){selected=room.id;render()}};build();
</script></body></html>
