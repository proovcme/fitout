<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FITOUT — Студия персонажей</title>
<style>
:root{--ink:#1e292e;--paper:#e9e1cf;--acid:#e8cd4f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#6f8988;color:var(--ink);font:700 14px/1.35 system-ui,sans-serif;background-image:linear-gradient(#ffffff0b 1px,transparent 1px),linear-gradient(90deg,#ffffff0b 1px,transparent 1px);background-size:24px 24px}.app{width:min(1160px,calc(100% - 28px));margin:22px auto;background:var(--paper);border:3px solid var(--ink);box-shadow:12px 14px 0 #26393d66}.head{display:flex;justify-content:space-between;gap:20px;padding:18px 22px;border-bottom:3px solid var(--ink)}h1{margin:0;font:900 clamp(24px,4vw,44px)/.95 Georgia,serif}.head p{max-width:500px;margin:0;color:#536268}.layout{display:grid;grid-template-columns:minmax(320px,.85fr) 1.15fr}.preview{display:grid;place-items:center;min-height:650px;padding:22px;background:#344e53;position:relative}.preview>canvas{width:min(100%,430px);aspect-ratio:3/4;background:linear-gradient(#8ca7a5,#637f80);border:2px solid #d7cfbc;box-shadow:8px 9px 0 #17262a}.badge{position:absolute;top:36px;left:36px;padding:7px 10px;background:var(--acid);transform:rotate(-2deg);font-size:11px}.panel{padding:22px;display:grid;align-content:start;gap:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:grid;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase}input,select,button{min-height:42px;border:2px solid var(--ink);background:#f4eddd;color:var(--ink);padding:8px 10px;font:800 13px inherit}input[type=color]{width:100%;padding:4px}button{cursor:pointer;background:var(--acid);box-shadow:3px 3px 0 var(--ink)}button:active{translate:2px 2px;box-shadow:1px 1px 0 var(--ink)}.profile{border:2px solid var(--ink);padding:14px;background:#fff8e8}.profile h2{margin:0 0 3px;font:900 25px Georgia,serif}.role{color:#a04e30}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.stats div{padding:7px 3px;background:#d8d2c1;text-align:center;font-size:9px}.stats b{display:block;font-size:16px}.traits{margin:9px 0 0;padding-left:18px;color:#4d5b60}.actions,.locks{display:flex;flex-wrap:wrap;gap:8px}.actions button{flex:1}.locks label{display:flex;align-items:center;gap:5px}.locks input{min-height:auto}.candidates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.candidate{padding:5px;background:#d8d2c1}.candidate canvas{display:block;width:100%;aspect-ratio:3/4;background:#78908f}.candidate small{display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note{font-size:11px;color:#59686c}.error{color:#a53c32}@media(max-width:760px){.layout{grid-template-columns:1fr}.preview{min-height:460px}.head{display:block}.head p{margin-top:10px}.candidates{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="app"><header class="head"><div><small>FITOUT · ВНУТРЕННИЙ ИНСТРУМЕНТ</small><h1>Люди из одного приказа</h1></div><p>Профессия определяет умения, пакет внешности — силуэт и одежду. Один seed всегда воспроизводит того же человека.</p></header><section class="layout"><div class="preview"><span class="badge" id="badge">SEED</span><canvas id="canvas" width="384" height="512"></canvas></div><div class="panel"><div class="grid"><label>Seed<input id="seed" value="Банкрот-001"></label><label>Класс<select id="role"></select></label><label>Пакет внешности<select id="pack"></select></label><label>Телосложение<select id="build"></select></label><label>Анимация<select id="state"><option value="idle">Ожидание</option><option value="walk">Ходьба · 8 кадров</option><option value="run">Бег</option><option value="drill">Сверлит</option><option value="hammer">Стучит</option><option value="sit">Сидит</option><option value="smoke">Курит</option><option value="computer">За компьютером</option><option value="carry">Несёт ящик</option></select></label><label>Направление<select id="direction"><option value="back">Спиной</option><option value="front">Лицом</option><option value="left">Влево</option><option value="right">Вправо</option></select></label><label>Цвет формы<input id="accent" type="color" value="#f28a24"></label><label>Скорость<input id="speed" type="range" min="0.4" max="2" value="1" step="0.05"></label></div><div class="locks"><label><input type="checkbox" checked>держать класс</label><label><input type="checkbox" checked>держать силуэт</label><label><input type="checkbox" checked>держать палитру</label></div><div class="actions"><button id="generate">Собрать</button><button id="random">Новый seed</button><button id="batch">8 вариантов</button></div><div class="candidates" id="candidates"></div><article class="profile"><h2 id="name">Загрузка…</h2><div class="role" id="roleLabel"></div><div class="stats" id="stats"></div><ul class="traits" id="traits"></ul></article><div class="actions"><button id="json">Скачать пакет JSON</button><button id="png">Сохранить кадр PNG</button></div><p class="note" id="status">Загружаю атласы.</p></div></section></main>
<script type="module">
import{ROLE_PRESETS,generateCharacter,loadCharacterAtlases,drawCharacter}from'./lib/character-generator.js';
import{APPEARANCE_PACKS,APPEARANCE_OPTIONS,compatibleAppearancePacks,makeCharacterDefinition,validateCharacterDefinition}from'./lib/character-appearance.js';
import{CHARACTER_CLASSES,WORK_TYPES}from'./lib/character-classes.js';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),role=$('role'),pack=$('pack'),buildSelect=$('build');
$('accent').closest('label').childNodes[0].textContent='Цвет формы / акцента';
for(const[key,value]of Object.entries(ROLE_PRESETS))role.add(new Option(value.label,key));for(const[key,value]of Object.entries(APPEARANCE_OPTIONS.builds))buildSelect.add(new Option(value.label,key));
let profile,atlases,started=performance.now(),generation=0;
function syncPacks(preferred){const packs=compatibleAppearancePacks(role.value);pack.replaceChildren(...packs.map(item=>new Option(item.label,item.id)));if(preferred&&packs.some(item=>item.id===preferred))pack.value=preferred}
function options(){return{role:role.value,accent:$('accent').value,appearance:{packId:pack.value,build:buildSelect.value,uniformTone:$('accent').value}}}
function renderProfile(){const actorClass=CHARACTER_CLASSES[profile.role],appearance=APPEARANCE_PACKS[profile.appearance.packId];$('name').textContent=profile.name;$('roleLabel').textContent=`${profile.roleLabel} · ${appearance.label}`;$('badge').textContent=profile.id.toUpperCase();$('stats').innerHTML=Object.entries(profile.stats).map(([key,value])=>`<div><b>${value}</b>${key}</div>`).join('');$('traits').innerHTML=[profile.biography.summary,...profile.traits,actorClass?`Профиль: ${actorClass.primary.map(id=>WORK_TYPES[id]?.label).join(', ')}`:'Нет должностной инструкции',`Нарисовано: ${appearance.supports.join(', ')}`].map(item=>`<li>${item}</li>`).join('')}
async function build(seed=$('seed').value){const version=++generation;profile=generateCharacter(seed,options());renderProfile();$('status').className='note';$('status').textContent='Собираю атлас и выравниваю кадры по стопам.';try{const loaded=await loadCharacterAtlases(profile);if(version!==generation)return;atlases=loaded;started=performance.now();const supported=APPEARANCE_PACKS[profile.appearance.packId].supports.includes($('state').value);$('status').textContent=supported?'Готово. Кадры стоят на одной опорной точке.':'Это действие для силуэта ещё не нарисовано — показываю idle, а не чужую жилетку.'}catch(error){$('status').className='note error';$('status').textContent=`Атлас не загрузился: ${error.message}`}}
async function batch(){const container=$('candidates'),[lockRole,lockPack,lockPalette]=document.querySelectorAll('.locks input');container.replaceChildren();for(let i=0;i<8;i++){const seed=`${$('seed').value}-${i+1}`,candidateOptions={},appearance={build:buildSelect.value};if(lockRole.checked)candidateOptions.role=role.value;if(lockPack.checked)appearance.packId=pack.value;if(lockPalette.checked)appearance.uniformTone=$('accent').value;candidateOptions.appearance=appearance;let candidate;try{candidate=generateCharacter(seed,candidateOptions)}catch{candidate=generateCharacter(seed,{role:role.value})}const candidateAtlases=await loadCharacterAtlases(candidate),card=document.createElement('button'),mini=document.createElement('canvas');mini.width=120;mini.height=160;drawCharacter(mini.getContext('2d'),candidateAtlases,candidate,'idle','front',0);card.className='candidate';const label=document.createElement('small');label.textContent=`${candidate.name} · ${candidate.roleLabel}`;card.append(mini,label);card.onclick=()=>{$('seed').value=seed;role.value=candidate.role;syncPacks(candidate.appearance.packId);pack.value=candidate.appearance.packId;build(seed)};container.append(card)}}
function loop(now){if(atlases)drawCharacter(ctx,atlases,profile,$('state').value,$('direction').value,(now-started)/1000*Number($('speed').value));requestAnimationFrame(loop)}
$('generate').onclick=()=>build();$('random').onclick=()=>{$('seed').value=`Банкрот-${Math.floor(Math.random()*999999).toString().padStart(6,'0')}`;build()};$('batch').onclick=batch;role.onchange=()=>{syncPacks();$('accent').value=ROLE_PRESETS[role.value].accent;build()};pack.onchange=()=>build();buildSelect.onchange=()=>build();$('accent').oninput=()=>build();$('state').onchange=()=>build();$('json').onclick=()=>{const definition=makeCharacterDefinition(profile),validation=validateCharacterDefinition(definition,{classes:CHARACTER_CLASSES}),blob=new Blob([JSON.stringify({...definition,validation},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${profile.id}.json`;a.click();URL.revokeObjectURL(a.href)};$('png').onclick=()=>{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download=`${profile.id}-${$('state').value}-${$('direction').value}.png`;a.click()};syncPacks();build();loop(performance.now());
</script></body></html>
