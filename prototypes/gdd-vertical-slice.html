<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FITOUT — vertical slice</title>
  <style>
    :root{--navy:#132a36;--paper:#f4eee0;--ink:#183342;--amber:#e3ad47;--red:#bd4a39;--mint:#7fa99c;--line:rgba(244,238,224,.32)}*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#0d202a;font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:var(--paper)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.scene{position:relative;min-height:100svh;overflow:hidden;background:#172f3b url('../public/assets/site-third-person-artdirection-v1.png') center/cover no-repeat}.scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,19,26,.48),transparent 25%,transparent 60%,rgba(7,19,26,.72)),linear-gradient(90deg,rgba(7,19,26,.36),transparent 45%);z-index:0}.scene.blueprint::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.65;background-image:linear-gradient(90deg,transparent 49.8%,rgba(190,225,225,.3) 50%,transparent 50.2%),linear-gradient(rgba(190,225,225,.16) 1px,transparent 1px),linear-gradient(90deg,rgba(190,225,225,.16) 1px,transparent 1px);background-size:100% 100%,44px 44px,44px 44px;mix-blend-mode:screen}.top,.objective,.party,.hotbar,.toast,.radial{position:absolute;z-index:3}.top{top:max(18px,env(safe-area-inset-top));left:max(22px,env(safe-area-inset-left));right:max(22px,env(safe-area-inset-right));display:flex;align-items:center;gap:14px}.brand{display:grid;grid-template-columns:39px auto;gap:8px;align-items:center;margin-right:auto}.brand i{display:grid;place-items:center;width:39px;height:39px;background:var(--amber);color:var(--navy);font-size:25px;font-style:normal;font-weight:950;transform:rotate(-5deg)}.brand strong{display:block;font-family:Georgia,serif;font-size:18px;line-height:.88;letter-spacing:-.05em}.brand small{display:block;margin-top:4px;color:#d9ddd5;font-size:8px;font-weight:900;letter-spacing:.13em}.mission{display:grid;gap:3px;padding:8px 12px;background:rgba(10,29,38,.68);border:1px solid var(--line);backdrop-filter:blur(7px)}.mission small{color:var(--amber);font-size:8px;font-weight:950;letter-spacing:.14em}.mission b{font-family:Georgia,serif;font-size:18px}.clock{display:flex;align-items:center;gap:10px;padding:8px 11px;background:rgba(10,29,38,.68);border:1px solid var(--line);font-variant-numeric:tabular-nums}.clock small{font-size:8px;font-weight:900}.clock strong{font-size:18px}.clock button{width:30px;height:30px;color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:50%}.clock button:hover{background:var(--amber);color:var(--navy)}
    .objective{left:max(22px,env(safe-area-inset-left));top:115px;width:min(330px,calc(100% - 44px));padding:14px 15px;background:rgba(13,39,49,.86);border-left:3px solid var(--amber);box-shadow:0 10px 30px rgba(0,0,0,.18);backdrop-filter:blur(8px)}.objective small{display:block;color:var(--amber);font-size:8px;font-weight:950;letter-spacing:.15em}.objective b{display:block;margin:5px 0;font-family:Georgia,serif;font-size:24px;line-height:.98}.objective p{margin:0;color:#d7e0d8;font-size:10px;line-height:1.43}.objective button{margin-top:10px;padding:0;color:var(--amber);background:transparent;border:0;border-bottom:1px solid currentColor;font-size:8px;font-weight:900}
    .world-tag{position:absolute;z-index:2;display:grid;gap:4px;min-width:124px;padding:8px 10px;color:var(--paper);background:rgba(13,39,49,.82);border:1px solid rgba(244,238,224,.38);box-shadow:3px 4px 0 rgba(0,0,0,.28);font-size:8px;font-weight:900;transform:translate(-50%,-50%);animation:float 2.6s ease-in-out infinite}.world-tag::after{content:"";position:absolute;left:50%;top:100%;height:34px;border-left:1px dashed var(--amber)}.world-tag small{color:var(--amber);font-size:7px;letter-spacing:.1em}.tag-cable{left:54%;top:32%}.tag-worker{left:73%;top:38%;animation-delay:.55s}.tag-client{left:49%;top:30%;animation-delay:1.1s}@keyframes float{50%{translate:0 -4px}}
    .party{right:max(22px,env(safe-area-inset-right));top:115px;display:grid;gap:6px;width:200px}.member{display:grid;grid-template-columns:35px 1fr;gap:8px;align-items:center;padding:7px;background:rgba(12,35,45,.76);border:1px solid var(--line);backdrop-filter:blur(7px);transition:.18s}.member:hover,.member.active{background:rgba(26,55,65,.95);border-color:var(--amber);transform:translateX(-4px)}.member i{display:grid;place-items:center;width:34px;height:34px;background:var(--color);border-radius:50% 45% 48% 42%;color:var(--navy);font-size:8px;font-style:normal;font-weight:950}.member span{display:grid;gap:2px}.member b{font-size:9px}.member small{color:#ccd9d2;font-size:7px}.member em{color:var(--amber);font-size:7px;font-style:normal;font-weight:900;letter-spacing:.08em}
    .hotbar{left:50%;bottom:max(24px,env(safe-area-inset-bottom));display:flex;gap:7px;translate:-50% 0;padding:8px;background:rgba(10,29,38,.78);border:1px solid var(--line);backdrop-filter:blur(9px)}.tool{display:grid;grid-template-columns:28px auto;gap:6px;align-items:center;min-width:120px;padding:6px;color:#dce4dc;background:transparent;border:1px solid transparent;text-align:left}.tool:hover,.tool.active{color:var(--navy);background:var(--amber);border-color:var(--amber)}.tool i{display:grid;place-items:center;width:27px;height:27px;background:rgba(244,238,224,.12);font-size:15px;font-style:normal}.tool.active i,.tool:hover i{background:rgba(19,42,54,.13)}.tool b{display:block;font-size:8px}.tool small{display:block;margin-top:2px;font-size:7px}.command{min-width:44px;color:var(--paper);background:var(--red);border:0;font-size:19px}.command:hover{scale:1.05}.radial{left:50%;top:52%;display:grid;place-items:center;width:226px;height:226px;translate:-50% -50%;border-radius:50%;background:rgba(13,39,49,.93);border:1px solid rgba(244,238,224,.36);box-shadow:0 18px 42px rgba(0,0,0,.35);backdrop-filter:blur(12px);opacity:0;pointer-events:none;scale:.8;transition:.18s}.radial.show{opacity:1;pointer-events:auto;scale:1}.radial b{display:grid;place-items:center;width:62px;height:62px;color:var(--navy);background:var(--amber);border-radius:50%;font-size:9px;text-align:center}.radial button{position:absolute;width:76px;height:42px;color:var(--paper);background:#234d5c;border:1px solid var(--line);font-size:8px;font-weight:900}.radial button:hover{color:var(--navy);background:var(--amber)}.radial button:nth-of-type(1){top:14px}.radial button:nth-of-type(2){right:-16px}.radial button:nth-of-type(3){bottom:14px}.radial button:nth-of-type(4){left:-16px}.toast{left:50%;bottom:102px;translate:-50% 0;min-width:300px;max-width:440px;padding:11px 14px;color:var(--navy);background:var(--amber);box-shadow:4px 5px 0 var(--red);font-size:10px;font-weight:900;text-align:center;opacity:0;transition:.18s}.toast.show{opacity:1;bottom:112px}
    @media(max-width:820px){.mission{display:none}.party{top:auto;bottom:100px;right:14px;width:130px}.member{grid-template-columns:30px 1fr;padding:5px}.member i{width:29px;height:29px}.member small{display:none}.member em{display:none}.objective{top:90px;left:14px;max-width:260px}.hotbar{gap:4px;width:calc(100% - 22px);justify-content:center}.tool{min-width:0;grid-template-columns:28px;padding:5px}.tool span{display:none}.command{display:grid!important;place-items:center}.clock small{display:none}.world-tag{display:none}}@media(max-width:520px){.objective{top:78px}.objective b{font-size:20px}.objective p{font-size:9px}.party{bottom:92px;grid-template-columns:1fr 1fr;width:136px}.brand strong{font-size:15px}.clock{padding:5px}.top{left:12px;right:12px}.toast{min-width:0;width:calc(100% - 32px)}}
  </style>
</head>
<body>
  <main class="scene" id="scene"><header class="top"><div class="brand"><i>F</i><span><strong>FITOUT<br>SIMULATOR</strong><small>ГЕНПОДРЯД КАК ПРИКЛЮЧЕНИЕ</small></span></div><div class="mission"><small>ГЛАВА 1 · ПЕРЕГОВОРНАЯ К ПОНЕДЕЛЬНИКУ</small><b>09:42 · первый рабочий день</b></div><div class="clock"><small>СБ · ДЕНЬ 1</small><strong id="clock">09:42</strong><button id="pause">Ⅱ</button></div></header>
    <section class="objective"><small>ЦЕЛЬ ГЛАВЫ · 1/3</small><b id="title">Разобраться с кабелем</b><p id="description">Борис нашёл кабель без владельца. Дойдите до него, осмотрите лазерным нивелиром и решите, кого сделать виноватым.</p><button id="focus">⌖ Показать в мире</button></section>
    <button class="world-tag tag-cable" data-goal="cable"><small>ПРОБЛЕМА · 12 М</small>Кабель без владельца</button><button class="world-tag tag-worker" data-goal="team"><small>БРИГАДА · 4 ЧЕЛ.</small>Ждут приказа</button><button class="world-tag tag-client" data-goal="client"><small>NPC · ЗАКАЗЧИК</small>Смотрит на часы</button>
    <aside class="party"><button class="member active" style="--color:#e3ad47"><i>ВЫ</i><span><b>Капитан</b><small>Генподрядчик</small><em>В ЗОНЕ</em></span></button><button class="member" style="--color:#d77b63"><i>АН</i><span><b>Алина</b><small>РП</small><em>ИЩЕТ СРОК</em></span></button><button class="member" style="--color:#70a9bb"><i>БТ</i><span><b>Борис</b><small>Технадзор</small><em>ЖДЁТ ВАС</em></span></button><button class="member" style="--color:#9a81c6"><i>МК</i><span><b>Мария</b><small>Архитектор</small><em>ДУМАЕТ</em></span></button></aside>
    <nav class="hotbar" aria-label="Инструменты"><button class="tool active" data-tool="laser"><i>⌁</i><span><b>Лазерный нивелир</b><small>Проверить плоскость</small></span></button><button class="tool" data-tool="hammer"><i>⚒</i><span><b>Демонтажный молот</b><small>Убрать препятствие</small></span></button><button class="tool" data-tool="tablet"><i>▤</i><span><b>Планшет прораба</b><small>План и деньги</small></span></button><button class="tool command" id="command" aria-label="Приказ бригаде">⌘</button></nav>
    <section class="radial" id="radial"><b>ПРИКАЗ<br>БРИГАДЕ</b><button data-command="demo">Демонтаж</button><button data-command="electric">Электрика</button><button data-command="carry">Разгрузка</button><button data-command="clean">Клининг</button></section><div class="toast" id="toast"></div>
  </main>
  <script>
    const state={time:582,paused:false,goal:'cable'};const goals={cable:{title:'Разобраться с кабелем',description:'Борис нашёл кабель без владельца. Дойдите до него, осмотрите лазерным нивелиром и решите, кого сделать виноватым.'},team:{title:'Вернуть бригаду к работе',description:'Четыре человека стоят и уже успели обсудить всё, кроме задания. Дайте им понятный фронт.'},client:{title:'Пережить заказчика',description:'Он смотрит на часы, хотя сам прислал правки в 08:57. Подойдите и выберите тон разговора.'}};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2900)}function setGoal(id){state.goal=id;const g=goals[id];$('#title').textContent=g.title;$('#description').textContent=g.description;toast(id==='cable'?'Капитан идёт к Борису. Кабель выглядит подозрительно.':id==='team'?'Бригада заметила ваш взгляд и стала работать заметно убедительнее.':'Заказчик засёк вас первым. Разговор неизбежен.')}$$('[data-goal]').forEach(x=>x.onclick=()=>setGoal(x.dataset.goal));$('#focus').onclick=()=>toast('Камера мягко ведёт к цели. В финальной версии здесь будет Spring-Arm и коллизии.');$$('[data-tool]').forEach(x=>x.onclick=()=>{$$('.tool').forEach(a=>a.classList.remove('active'));x.classList.add('active');toast(x.dataset.tool==='laser'?'Лазерный нивелир включён: ищем правду на плоскости.':'Инструмент выбран. В финальной версии — действие прямо в мире.');});$('#command').onclick=()=>$('#radial').classList.toggle('show');$$('[data-command]').forEach(x=>x.onclick=()=>{$('#radial').classList.remove('show');toast(`Приказ: ${x.textContent}. Бригада бежит в зону — и на секунду всё выглядит управляемым.`)});$('#pause').onclick=()=>{state.paused=!state.paused;$('#pause').textContent=state.paused?'▶':'Ⅱ'};setInterval(()=>{if(state.paused)return;state.time++;const h=Math.floor(state.time/60)%24,m=state.time%60;$('#clock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`},1000);
  </script>
</body>
</html>
