name: Test FITOUT release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitout-release-tests
  cancel-in-progress: false

jobs:
  test:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Test and build the exact commit
        run: npm run test:release
